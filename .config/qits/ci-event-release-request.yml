# THE QA PIPELINE — this repository's only pipeline besides the release recipe, and it runs for
# RELEASE REQUESTS ALONE. It replaces ci-event-build.yml and ci-event-userflows.yml, both deleted in
# the commit that added this file. The reference template with the full argument is qits-ci's
# docs/ci-event-release-request.yml.
#
# Per-push CI is retired platform-wide: nothing builds a branch, because cd deploys what a RELEASE
# published rather than what a push built. qits-projects keeps, per open release request, a backing
# branch `release/<id>` — an octopus merge of the request's sources, refolded whenever the set
# changes — and publishes `ReleaseRequestChanged` on every successful re-fold. That branch is
# written by qits-githost's merge primitive, which fires no post-receive and therefore publishes no
# `SCMPublishCommit`: without this event the fold exists and nothing builds it.
#
# DECIDE AT MAIN, BUILD AT THE FOLD. The file is discovered, parsed and selected at this
# repository's `main` head; only the run's branch and sha come from the payload. So a release
# request cannot alter the CI that gates it by folding in a commit that edits this file.
#
# ONE FILE, TWO HALVES, and "a red verify must not cost the image" still holds — bought with
# ORDERING plus PER-STEP CLASSIFICATION rather than with two files that cannot share a verdict. The
# gating build is FIRST; the userflow half declares `gating: false`, which still fails the run and
# shows red but does not hold the fold for qits-projects' build gate. Keep it LAST: everything after
# a failing step is SKIPPED.
#
# THE SHA IMAGE IS GONE, AND SO IS THE LOCAL TAG THAT OUTLIVED IT. The old build step ended in
# `docker push $QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-stt:$QITS_CI_SHA`, the per-push coordinate
# cd keyed on; a fold's merged sha is not a coordinate anything could deploy, so the push went and a
# local `-t qits-stt:<sha>` stood in as the gate's artifact. Under the platform builder there is no
# local image store to hold a tag either, so the build below declares no output at all: it builds
# every layer, proves the fold, exports nothing, and leaves the layers in the builder's cache. The
# CalVer coordinate is ci-event-release.yml's, and that file's matching build is what turns this
# cache into a fast release.
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit, no tag and no image — nothing
# the fold is made of changes, so it cannot re-trigger itself. Publish-if-absent: events redeliver
# and docs versions are immutable, so 409 is success.
event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's own coordinate can be an opaque UUID since the identity
  # cutover, so a name match on repoId is not dependable. The event echoes the public name; a rename
  # updates this line in the same campaign. `suppressCi` went with the push event that carried it —
  # a release request is not a push and `-o qits.no-ci` has nothing to say about one.
  - repoName: { exact: qits-stt-service }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  # --- the GATING half: build the fold ------------------------------------------------------------
  # ci-event-build.yml's step, minus the push.
  #
  # THE BUILD RUNS ON THE PLATFORM'S OWN BUILDKITD, NOT THE HOST DAEMON — qits-buildkit-plan.md in
  # the wrapper is the whole migration, and qits-workspace-daemon's pipeline pair is the reference
  # recipe. `build: true` is what declares it: qits-ci hands such a step $QITS_BUILD_REGISTRY and
  # the run's commissioned credential, qits-containers hands it $BUILDKIT_HOST, and the host docker
  # socket this step used to hold is not mounted at all any more. Nothing here touches docker.
  #
  # THE HOST-GATEWAY FLAGS ARE GONE AND NOTHING REPLACES THEM. `--add-host <registry>:host-gateway`
  # and its mirror twin were this repository's own spelling of the fleet's `--network host`: a way
  # for a `RUN` inside a bridge-network build to reach two edge vhosts published on the HOST's
  # loopback (measured 2026-09-04, where a cold cache died on "connection refused"). A `RUN`
  # executes in the builder's namespace on qits-net now, so what a build dials it dials by
  # IN-NETWORK address — $QITS_MAVEN_REGISTRY_URL and $QITS_MAVEN_PROXY_URL below, the two the step
  # plane already carries — and there is no host loopback in the picture to bridge to.
  #
  # The Dockerfile's `FROM` lines keep their committed edge-vhost spellings: the builder's own
  # registry config rewrites them to the platform aliases (qits-containers' buildkitd.toml carries
  # the mapping), where the host daemon's registry-mirrors used to.
  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this an early failure would be
      # swallowed by the next command's exit code — a green verdict for a fold that does not build is
      # exactly what a release gate must never be told. -u stops the step on an unset injected
      # variable rather than letting a build-arg be composed out of empty strings.
      set -eu
      # $QITS_CI_BRANCH is release/<id> and $QITS_CI_SHA is the merged sha — the fold is already
      # checked out, so nothing here fetches or switches refs.
      #
      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch (qits.ci.buildkit.enabled=false
      # spells off as empty-never-absent). Either way this step must fail here, naming the cause,
      # rather than fall back to a socket it no longer holds. $QITS_BUILD_REGISTRY is demanded even
      # though nothing is pushed below: it is the pair's other half and an empty one means the same
      # switch is off.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # THE TWO SECRETS IN FILE FORM ON BOTH SIDES: written here under umask 077 into /tmp — outside
      # the clone, so neither can enter the build context — handed to buildctl as `src=`, and
      # mounted by the Dockerfile as bare files under /run/secrets. Never a --build-arg, which is
      # recorded in a pullable image's history; and never the `env=` mount form, which couples this
      # recipe to whichever dockerfile frontend the BUILDER happens to choose. The launcher injects
      # the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; the Dockerfile's mvnw RUN
      # reads the files as `.qits-maven-settings.xml`'s `qits-maven-network` server credential —
      # the answer to the registry's 401 once reads are gated, unused literals until then.
      #
      # `${VAR-}` RATHER THAN `$VAR`, BECAUSE `set -u` IS ABOVE. A deployment that commissions
      # nothing (no oidc client) sends neither variable, and this step must still build green — the
      # property the retired `--secret …,env=` flags had for free, since a missing env source is not
      # an error. Two empty files read exactly as unset ones do at the settings, so the property is
      # kept rather than quietly traded for one less character.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET-}" > /tmp/qits-client-secret

      # NOTHING IS PUBLISHED HERE, AND NOW THERE IS NOT EVEN A TAG. The registry-qualified
      # `:$QITS_CI_SHA` coordinate was the per-push publication and retired with the push path; what
      # replaced it was a local tag, and there is no local image store on this path either — so the
      # build simply declares no `--output` at all. buildctl then builds every layer, proves the
      # fold, and exports nothing, which is exactly what this gate is for. The layers stay in the
      # builder's cache, so ci-event-release.yml's matching build of the released tree is a stack of
      # cache hits.
      #
      # Both build-args are the IN-NETWORK routes, which is the whole of what the host-gateway
      # flags used to buy: $QITS_MAVEN_REGISTRY_URL is the platform Maven repository as a container
      # on qits-net reaches it, and $QITS_MAVEN_PROXY_URL is Maven Central's pull-through by the
      # same reading. Empty for the mirror — an older qits-ci, or the mirror plane turned off —
      # deactivates the settings profile and Central is resolved directly, as it always was.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret

  # --- the NON-GATING half: verify the stories, and publish what the run observed -----------------
  # ci-event-userflows.yml's step, unchanged but for `gating: false`, which is the whole of what that
  # separate file was.
  #
  # `mvn verify` at the fold — which regenerates service/target/userstories/ through the four
  # @QuarkusIntegrationTest story classes — and the reports published as one docs bundle, site
  # @userflows/qits-stt, version = the merged sha, branch riding as artifacts metadata for discovery.
  #
  # ONE STEP, BECAUSE STEPS SHARE NOTHING. Every step container clones the repository for itself, so
  # the gating step above cannot hand this one anything: the verify and the publish stay together.
  #
  # THE CATALOGUE, so a reader of this file knows what the bundle holds:
  #
  #   api/TranscriptionBootstrapIT            transcription    a clip end to end, and the six refusals
  #   stories/transcription/ResidentEngineIT  transcription    a second clip is not a second engine
  #   stories/home/SpeechHomeBootstrapIT      the speech home  a volume that was never pre-seeded
  #   stories/engine/EngineFailureIT          the engine       gone, refusing, babbling — and the
  #                                                            respawn each one does or does not cost
  #
  # `user: build`, and NOT a switch inside the script. In the sibling files that line is the initdb
  # workaround — zonky's embedded postgres refuses to run as root — and NONE of that applies here:
  # this service owns no tables, has no datasource and the poms name no zonky binaries. It is spelled
  # anyway because it is the fleet's posture for a step that only builds: passwd-backed non-root
  # (maven-base carries one), cap-drop=ALL, no chown and no su available to undo it. Nothing this step
  # runs wants any of those — the suite writes only under `target/`, which the checkout owns.
  #
  # NO PYTHON IN THIS STEP, and that is worth saying out loud in the one repository whose RUNTIME
  # needs one. docker/Dockerfile installs python3.12 because the shipped service spawns a venv; the
  # stories do not, and must not: stories/support/StoryEngine stages the whole speech home under
  # target/ and BOTH children in it are /bin/sh — a resident worker at venv/bin/python speaking the
  # worker protocol, and a stand-in host interpreter at host/python3 that records the venv attempt and
  # refuses. So nothing here creates a venv, runs pip, or pulls ~700 MB from the Hugging Face hub. A
  # userflow that needed the real engine would need outbound PyPI and hub access on every fold, and
  # would take minutes.
  #
  # The second stand-in is not belt-and-braces, it is what makes an ABSENCE assertable: every story
  # that transcribes anything pins assertNoEdgesTo("the host python"), and that claim only means
  # something because the binary is right there and would have recorded had it been run.
  #
  # NO QUINOA FLAG, unlike every sibling's copy of this file. `-Dquarkus.quinoa=false` is there to keep
  # a step with an EMPTY webui submodule from failing on it; qits-stt has no webui and no Quinoa
  # extension at all — the browser recorder lives in the monorepo (README.md, "What is deliberately
  # not here"). A flag for an extension this build does not have would only read as if it did.
  #
  # NO IT FLAGS EITHER, AND THAT IS DELIBERATELY DIFFERENT FROM THE SIBLING CATALOGUES. They name
  # their story classes in a `-Dit.test` list here, which means a class added without touching this
  # file is silently never run. This repository opts its ITs back in from the pom (`skipITs` false in
  # service/pom.xml) the way qits-githost and qits-docs do, so `mvn verify` runs EVERY story class
  # there is and a new one is covered the day it is written. It can afford to: every IT here is a
  # story class, they share one @TestProfile so the fast-jar is launched once, and the heaviest thing
  # any of them touches is a /bin/sh child — no docker gate, no database, no network. Nothing a
  # flipped property could drag into somebody's plain `mvn verify`. The surefire half of this run is
  # the same suite a clone already runs.
  - image: qits/build-images/maven-base:latest
    user: build
    gating: false
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker. qits-auth-core has always
      # come from there; qits-userflows joins it with the userflows rollout.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL"

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. The path is service/target/… and not target/…: `service` is the
      # module that is the application, and the IT lives with it.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the merged sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-stt" \
        "$QITS_DOCS_URL/@userflows/qits-stt/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-stt@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-stt@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
