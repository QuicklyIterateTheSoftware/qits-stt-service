# The application config for qits-stt as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. This service sets no forward-auth key
# anywhere: forward-auth leaves qits-auth-core (qits-1338), and the bearer tenant below is the door.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite once
# carried a private copy in src/test/resources and the packaged app had none. That copy is gone: the
# tests read *this* file, so it is the only place an app-level setting is declared.

quarkus.application.name=qits-stt

# The JAX-RS prefix every qits route lives under, segment first: /<segment>/api, where the segment is
# this service's name without the `qits-` prefix. qits-platform-edge routes verbatim by prefix —
# /stt/* to qits-stt, with no rewriting — so the service has to serve the prefixed path itself.
# Without this key POST /stt/api/transcriptions moves to /transcriptions, which no edge route reaches
# and every caller 404s on. SpeechControllerTest asserts the absolute path against this value, so breaking it
# here breaks the suite rather than only production.
quarkus.rest.path=/stt/api

# The framework's own root — /q/openapi, /q/swagger-ui, health — moves under the segment for the same
# reason: the edge routes by prefix, so anything left at the bare root is unreachable through it.
# quarkus.swagger-ui.path is relative and follows this automatically; do not pin it.
quarkus.http.non-application-root-path=/stt/q

# Audio uploads. The monorepo raised this app-wide and this endpoint inherited it; at the platform
# default a recording of any length is rejected at the HTTP layer before SpeechController is
# entered.
quarkus.http.limits.max-body-size=64M

# --- the caller's bearer token ------------------------------------------------------------------
# Every caller presents a qits-idp bearer (epic qits-543, qits-1370): a browser signs in with an idp
# token and sends it through the edge (qits-1340), the edge asserts no identity of its own any more
# (qits-1373), and forward-auth leaves qits-auth-core (qits-1338). So this tenant is the only way
# in. Its `groups` claim becomes the identity's roles, so SpeechController's @RolesAllowed decides
# exactly as before. A request with no token is anonymous and challenged; a token that does not
# validate is 401.
#
# ON BY DEFAULT, so a deployment needs no config for it. It requires nothing and holds no secret.
# Off in %dev and %test, which have no idp: the @QuarkusTest suite names its identity with
# @TestSecurity, and security/BearerAuthProfile turns the tenant back on with a local key; the
# packaged story catalogue does the same in StoryProfile.
quarkus.oidc.tenant-enabled=true
%dev.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.tenant-enabled=false

# Bearer only: no login flow, no session.
quarkus.oidc.application-type=service

# THE IDP THROUGH THE EDGE, never a wire alias (owner ruling on qits-533): discovery reads
# <auth-server-url>/.well-known/openid-configuration and takes the JWKS address (`jwks_uri`) and the
# issuer from it. qits-deployments writes QITS_DOMAIN into every container; `localhost` is only what
# an undeployed process composes. Validating a token needs no client of this service's own; the
# `idp:client` resource and QITS_RESOURCE_IDP_* below are for the token this service PRESENTS.
quarkus.oidc.auth-server-url=https://idp.qits.${QITS_DOMAIN:localhost}/idp

# THE ISSUER IS NOT CONFIGURATION. With discovery on, quarkus-oidc compares every token's `iss` to
# the `issuer` the idp publishes in its discovery document (https://idp.qits.<domain>), and refuses
# a token with any other. There is deliberately no quarkus.oidc.token.issuer line.

# FETCH KEYS WHEN A TOKEN NEEDS ONE, NEVER AT BOOT. Boot fetches no keys, so the service starts
# whether the idp is up or not; the first bearer fetches the key by the token's `kid`, and it is
# cached. Resolve the idp's host name off the event loop: a resolution on the event loop was a 2.7 s
# blocked thread in qits-events' packaged ITs.
quarkus.oidc.jwks.resolve-early=false
quarkus.oidc.use-blocking-dns-lookup=true

# Which tokens are for this platform. `qits-platform` is the one audience qits-idp stamps on every
# token it mints, so a token carrying some other `aud`, or none, is 401 before any role is read.
# Addressing is not a permission: what a caller may do here is decided by its `groups` against
# @RolesAllowed. Spelled as the literal on purpose: the audience is the platform's, not this
# deployment's.
quarkus.oidc.token.audience=qits-platform

# --- the token this service PRESENTS (qits-428) --------------------------------------------------
# ONE named client, `qits`: this service's own `qits:system` bearer, minted by client credentials.
# Its one reader is qits-telemetry-core (below, under telemetry), whose exporters attach it on every
# OTLP export, because the edge refuses an anonymous POST to qits-observability's host. It is
# quarkus-oidc-client alone and has nothing to do with the tenant above.
#
# Its id, secret and idp address are this application's own qits-idp service client, which the
# deployer commissions from the `idp:client` resource in .config/qits/deployments.yml and injects as
# QITS_RESOURCE_IDP_URL / _CLIENT_ID / _CLIENT_SECRET. The fallback address is the idp's public
# edge host; unlike the tenant's, it carries NO QITS_DOMAIN default, the estate's rule (qits-1402):
# a deployment always has the resource, so the fallback only ever resolves in an undeployed run,
# where the client is off.
#
# Discovery and early token acquisition are off, so building the client dials nothing: the first
# export is the first contact. telemetry/QitsClientMintTest runs the request through this very
# client against a stand-in token endpoint.
quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:https://idp.qits.${QITS_DOMAIN}/idp}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:dev-qits-stt}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
quarkus.oidc-client.qits.grant.type=client
# One audience for every service: qits-platform, the one the tenant above checks for too.
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
# On wherever the deployer runs it. Off under %dev and %test, so a suite or a local run never dials
# an idp; QitsClientMintTest turns it on against its stand-in.
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# --- the API document -------------------------------------------------------------------------
# Served at /stt/q/openapi, with the browsable UI at /stt/q/swagger-ui — both outside
# quarkus.rest.path, under quarkus.http.non-application-root-path instead.
# always-include because swagger-ui is a dev-mode-only extension by default, and the point of
# packaging these as processes is that each documents its own surface in a real deployment.
quarkus.smallrye-openapi.info-title=qits-stt API
quarkus.swagger-ui.always-include=true

# --- speech ------------------------------------------------------------------------------------
# Where the venv and models live. The code default is the relative `data/speech`, which resolves
# against the process's working directory — fine for a test, wrong for a packaged process whose CWD
# is whatever the container entrypoint happened to be. Pin it to the same absolute location the
# monorepo used.
qits.speech.home=${user.home}/.qits/speech

# NOT set here, deliberately: qits.speech.warmup-on-start. The monorepo shipped it true, but warmup
# bootstraps a venv with `pip install` — network I/O during startup, which turns an offline or
# slow-registry deployment into a failed boot rather than a slow first transcription. Left at the
# code default (false); a deployment that wants the warm start opts in.

# --- telemetry --------------------------------------------------------------------------------
# OTLP to qits-observability, THROUGH THE EDGE (epic qits-428). The extension instruments; the
# exporters are qits-telemetry-core's CDI beans, built on OpenTelemetry's upstream OTLP/HTTP
# builders, whose header supplier attaches the `qits` oidc client's CURRENT bearer (the client
# above) on every export. The edge refuses an anonymous POST to the receiver's vhost, and Quarkus'
# own exporter takes only static headers, which is why it is replaced.
#
# The receiver's address is the module's default, its edge host:
#   qits.telemetry.endpoint=https://observability.qits.${QITS_DOMAIN}/observability/api/otel
# QITS_DOMAIN has no default; the key is read only when the SDK builds the exporters, so %dev and
# %test (SDK off, below) never need it. /v1/{traces,logs,metrics} is appended by the module.
#
# qits.observability.url and quarkus.otel.exporter.otlp.endpoint/.protocol are GONE: with this jar
# on the classpath none of Quarkus' own OTLP exporters is ever built, so they reached nothing.

# The three signals through the CDI exporters. `cdi` is Quarkus' default for all three; spelled out
# so that a changed default is a diff and not a silence.
quarkus.otel.traces.exporter=cdi

# Logs ride the CDI log exporter; traces are on by default. The receiver decodes all three signals,
# and a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at qits-telemetry-core's LogRecordExporter bean (Quarkus builds
# its own only when bean discovery finds none); `handler.enabled` is the JBoss Log Manager handler
# that turns an ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other
# two keys describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# The bridge itself is proven in qits-events, whose OtelLogBridgeTest decodes a real
# ExportLogsServiceRequest and whose PackagedLogBridgeIT repeats it against the packaged artifact.
# The extension and this configuration are the same here, so this repo carries no second copy of
# that proof — only OtelLogConfigTest, which pins these keys and the exporter they ride.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true
quarkus.otel.metrics.exporter=cdi

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real. With the SDK off
# the exporters are never built, so neither profile needs QITS_DOMAIN or the oidc client for it.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-stt` rather than qits-stt-service-<version>-runner, so `-Dnative`
# produces target/qits-stt and the container process is identifiable in `ps` / `docker top`. The
# failsafe plugin's native.image.path in service/pom.xml spells the same name; they move together.
quarkus.package.output-name=qits-stt
quarkus.package.jar.add-runner-suffix=false
