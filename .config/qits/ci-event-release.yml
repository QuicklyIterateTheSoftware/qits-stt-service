# The release pipeline: this repository reacts to its OWN release and pushes the image under the
# released VERSION.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT. `SCMRelease` says only
# "source control has this version" — qits-projects' Auto Release publishes it the instant it has
# stamped the CalVer and pushed the tag, and nothing in this file publishes it. So a repository listening for its own SCMRelease
# is exactly the release pipeline the split-release design asks each repository to own: the SCM half
# fires, this half builds the tagged commit and pushes it, and qits-ci turns the green run into one
# `SoftwareRelease` per entry under `artifacts:` below. The event that could loop is
# SoftwareRelease, and this file neither listens for it nor publishes it.
#
# THE VERSION TAG IS THE ONLY COORDINATE NOW. It used to be the second of two, beside the
# `:$QITS_CI_SHA` push of the per-push pipeline; that pipeline is retired and the QA pipeline that
# replaced it builds a fold and publishes no image at all. qits-deployments deploys the released
# VERSION, which is what `artifacts:` declares and what every consumer of the resulting
# `SoftwareRelease` asks for.
#
# `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything, so it
# cannot see what the step below pushed; it announces `{repository, version, packageType,
# packageName}` on the strength of these two lines. Keep them true.
#
# THE NAME IS UNQUALIFIED ON PURPOSE. No registry-qualified docker reference is portable here — the
# registry is one service under several addresses (`$QITS_BUILD_REGISTRY` to the platform builder,
# `$QITS_REGISTRY` to the host daemon and qits-deployments) — and an OCI reference cannot carry a
# path prefix. So the declaration carries `qits/<application>` and the reader supplies its own host,
# exactly as the push below composes one from environment.
#
# THIS FILE IS INERT UNTIL qits-projects PUBLISHES SCMRelease, and it lands first on purpose: the
# bus is at-most-once with no catch-up and no replay, so a trigger file must be in place before the
# event it selects exists. The other order loses a release and looks like a train that quietly did
# not roll.
event: SCMRelease
when:
  - repository: { exact: qits-stt-service }
artifacts:
  - { type: docker, name: qits/qits-stt }
steps:
    # node-docker-base rather than the ci-base this repository's older pipelines used, for one
    # reason that survived the move to the platform builder: this step has to read the event
    # payload, which is JSON, and ci-base carries no node, no jq and no python (measured). The image
    # is a step image like any other now — it ships buildctl, as ci-base does — and the docker CLI
    # its name still advertises is not used by anything below.
    #
    # `build: true` REPLACED `docker: true`. The build runs on the platform's own buildkitd rather
    # than on the host daemon's socket: qits-ci hands such a step $QITS_BUILD_REGISTRY and the run's
    # commissioned credential, qits-containers hands it $BUILDKIT_HOST, and no socket is mounted.
    # ci-event-release-request.yml carries the arrangement at length — the retired host-gateway
    # flags, the in-network build-args, the file-form secrets — and qits-buildkit-plan.md in the
    # wrapper is the migration. THE BUILD BELOW IS THAT FILE'S AND THE TWO MUST STAY MATCHED, byte
    # for byte in every buildctl argument: the builder's cache is shared, so a matched build is what
    # makes a release that follows a green fold a stack of cache hits rather than a second native
    # compile.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this an early failure would be
      # swallowed by the next command's exit code — and a green release run is what makes qits-ci
      # announce the artifact, so it has to mean the image really was built and pushed. -u makes an
      # unset injected variable stop the step too.
      set -eu

      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch. Either way this recipe must fail
      # here, naming the cause, rather than push a ref composed out of empty strings.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD; there is no per-field projection.
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      echo "releasing qits/qits-stt:$version"

      # THE TAG IS THE CHECKOUT TARGET, and it is the only reason this run needs one. An
      # event-triggered run is cloned at the head of main, which is where the release commit is
      # *now* — a later push moves that, and the tag does not, so a busy main cannot make this
      # pipeline ship a different tree than the one that was released. The clone is shallow and
      # carries no tags, hence the explicit refspec; the URL rather than `origin` because every
      # address a step needs arrives as environment. `checkout --detach` peels the annotated tag to
      # its commit.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # THE TWO SECRETS IN FILE FORM ON BOTH SIDES: written here under umask 077 into /tmp — outside
      # the clone, so neither can enter the build context — handed to buildctl as `src=`, and
      # mounted by the Dockerfile as bare files under /run/secrets. Never a --build-arg, which is
      # recorded in a pullable image's history; and never the `env=` mount form, which couples this
      # recipe to whichever dockerfile frontend the BUILDER chooses. The launcher injects the run's
      # commissioned idp client as $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET,
      # and the Dockerfile's mvnw RUN reads the files as `.qits-maven-settings.xml`'s
      # `qits-maven-network` server — sent only if the registry ever answers 401, which it does not
      # yet. `${VAR-}` rather than `$VAR` because `set -u` is above: a deployment that commissions
      # nothing sends neither variable and must still build green, which is the property the retired
      # `--secret …,env=` flags had for free. ci-event-release-request.yml writes the identical
      # three lines.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET-}" > /tmp/qits-client-secret

      # NO HOST-GATEWAY FLAGS, AND NOTHING REPLACES THEM: a `RUN` executes in the builder's own
      # namespace on qits-net, so the two addresses this build needs are the IN-NETWORK ones the
      # step plane already carries — $QITS_MAVEN_REGISTRY_URL for the platform Maven repository and
      # $QITS_MAVEN_PROXY_URL for Maven Central's pull-through. Empty for the mirror deactivates the
      # settings profile and Central is resolved directly, as it always was.
      #
      # `push=true` IS THE PUBLISH: the image goes from the builder to the registry and never enters
      # any local image store — which is why there is no `docker rmi` question left; the old note
      # about a concurrent-build rmi race described a store this pipeline no longer touches.
      # $QITS_BUILD_REGISTRY is the registry as the BUILDER resolves it; $QITS_REGISTRY stays the
      # host daemon's view and is not dialled here.
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-stt:$version"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"

      # --- the SBOM -----------------------------------------------------------------------------
      # THE DOCUMENT GOES UP AFTER THE PUSH AND BEFORE THIS STEP EXITS GREEN. qits-ci announces
      # `SoftwareRelease` only for a green run, so ordering is the whole guarantee: no consumer is
      # ever told about a version whose bill of materials is missing. A failed PUT fails the release
      # ON PURPOSE — the store being down is not a reason to announce a version nobody can audit.
      # Only THIS pipeline uploads one: the QA pipeline publishes no image and announces no
      # release, so it owes no document.
      #
      # The second `buildctl build` reaches the Dockerfile's `sbom` stage — a `FROM scratch` holding
      # only the service module's CycloneDX document, exported with `type=local` instead of pushed.
      # Build-args and secrets are BYTE-IDENTICAL to the image build above, which is what makes
      # every layer a cache hit in the same builder and this export seconds rather than a second
      # native compile; a drift between the two invocations costs a full rebuild, not a wrong
      # document. (`--add-host` used to be part of that identity and is gone from both, together.)
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom
      # The SBOM store is a sibling path of the npm registry inside the qits-artifacts deployment,
      # so its root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias a STEP container can
      # reach. NOT from $QITS_REGISTRY, the host-published name: from in here it answers curl with
      # an instant connection refusal, and the edge in front of it 401s a sessionless write besides
      # (measured twice on 2026.902.53027). Nor from $QITS_BUILD_REGISTRY, which is the BUILDER's
      # address for the registry while this PUT is the step's own. The path
      # names the DECLARED artifact identity verbatim: `artifacts:` above says
      # `{type: docker, name: qits/qits-stt}`, and (packageType, packageName, version)
      # is how the SoftwareRelease consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/qits-stt/-/$version"
