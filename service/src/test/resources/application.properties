# Test-mode configuration for qits-stt's suite.
#
# THIS FILE IS BACK, AND IT HOLDS EXACTLY ONE LINE. AGENTS.md ("Tests") records why it was deleted:
# app-level config lives in src/main/resources/application.properties and the tests read THAT copy —
# Quarkus merges it into the test run rather than shadowing it, which is why SpeechControllerTest can
# assert /stt/api/transcriptions with no test-side quarkus.rest.path. Re-declaring any such key here
# would make the suite lie about the shipped file. The rule stands: this file is for genuine
# test-only overrides, and a real override belongs in a @TestProfile next to the test that needs it
# (NoDevUserProfile, TranscriptionServiceTest.SpeechTestProfile, TranscriptionBootstrapIT's
# PackagedWithAPreSeededEngine) so its scope is visible. The line below is neither: it configures the
# JUnit run itself, which has no other home.
#
# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application isn't torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the secondary orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and the ordinary test classes (no story annotations) are untouched.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1); do not enable parallel execution.
#
# FIVE STORY CLASSES SHARE ONE PROFILE NOW, AND THIS LINE IS WHAT ORDERS THEM. The engine recording
# is cumulative and attributed by a cursor, so the first spawn — which this service makes on its
# first REQUEST, warmup being off, rather than at boot — lands in whichever story drains first.
# TranscriptionBootstrapIT is the story that claims it, and every other class carries
# @UserflowRunsAfter to say so; without this orderer that graph is ignored, JUnit picks its own
# order, and the symptom is an edge count failing in a story that did nothing wrong.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer
