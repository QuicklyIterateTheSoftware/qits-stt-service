# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is
# the trunk push alone — and then promotes onto the branch it is configured with
# (`qits.workspaces.release.entry-branch`). `deploy_branches` used to name that branch here, in
# thirteen copies of one platform-wide answer, and a release pushed onto every entry it named.
#
# ENVIRONMENT service: every environment runs its own instance, and a green build deploys into
# whichever tier listens to the built branch.
deployment_target: environment

# WHAT THIS REPOSITORY DEPLOYS AS, held still across the repository rename. The repository is
# qits-stt-service now; the application is still qits-stt, so nothing that is running moves: the
# swarm service and its wire alias, the container, the image qits/qits-stt the build pushes, the
# provisioned database, the derived host label, the extras family and the QITS_APPLICATION the
# container boots with all keep the names they have. Omitted, this name would be DERIVED from the
# repository, and the rename would read as a decommission plus a new application rather than a
# rename. Changing the value later is exactly that decommission, so it does not change again.
application: qits-stt

# The speech API has no browser surface of its own, so it deliberately has no navigation entry.
routes: /stt

# Where the browsable API document lives: swagger-ui under this service's non-application
# root, which sits under the primary route above. The shell's Api Docs viewer reads it off
# /main-navigation and frames it for this repository.
api-docs: /stt/q/swagger-ui
